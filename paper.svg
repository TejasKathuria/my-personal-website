<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <filter id="crumpleLight" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="6" seed="11" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#ffffff" surfaceScale="4" diffuseConstant="1.15" result="light">
        <feDistantLight azimuth="235" elevation="55"/>
      </feDiffuseLighting>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="oklch(0.99 0 0)"/>
  <rect width="1200" height="1200" filter="url(#crumpleLight)" style="mix-blend-mode:multiply" opacity="0.5"/>
</svg>
